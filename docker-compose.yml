version: "3.9"

# ── Shared defaults ───────────────────────────────────────────────────────────
x-backend-common: &backend-common
  build:
    context: ./backend
    dockerfile: Dockerfile
  env_file: ./backend/.env
  environment:
    - MONGODB_URL=mongodb://mongo:27017
    - REDIS_URL=redis://redis:6379/0
  depends_on:
    mongo:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - mediaerp_net
  restart: unless-stopped

services:

  # ── MongoDB ──────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: mediaerp_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - mediaerp_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: mediaerp_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mediaerp_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ── FastAPI backend ───────────────────────────────────────────────────────────
  backend:
    <<: *backend-common
    container_name: mediaerp_backend
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --workers 2
      --log-level info
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Celery worker ─────────────────────────────────────────────────────────────
  celery_worker:
    <<: *backend-common
    container_name: mediaerp_celery_worker
    command: >
      celery -A app.tasks.celery_app worker
      --loglevel=info
      --concurrency=4
      --queues=default
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "app.tasks.celery_app", "inspect", "ping", "-d", "celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Celery beat (scheduler) ───────────────────────────────────────────────────
  celery_beat:
    <<: *backend-common
    container_name: mediaerp_celery_beat
    command: >
      celery -A app.tasks.celery_app beat
      --loglevel=info
      --scheduler celery.beat:PersistentScheduler
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  # ── Next.js frontend ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # NEXT_PUBLIC_API_URL is only kept as a build arg because it's still read
      # as an SSR fallback (see lib/axios.ts) — client code no longer uses it,
      # so the browser never sees "backend" as an API host regardless.
      args:
        - NEXT_PUBLIC_API_URL=http://backend:8000/api/v1
    container_name: mediaerp_frontend
    ports:
      - "3000:3000"
    environment:
      # Server-only — read by next.config.ts's rewrite so the container's
      # internal Docker-network hostname is never sent to the browser.
      - BACKEND_API_URL=http://backend:8000/api/v1
      - NEXT_PUBLIC_API_URL=http://backend:8000/api/v1
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mediaerp_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e",
             "require('http').get('http://localhost:3000', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local

networks:
  mediaerp_net:
    driver: bridge
